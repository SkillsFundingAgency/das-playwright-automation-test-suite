trigger: none
pr: none
variables:
- template: ../pipeline-templates/vars.yml
- name: projectName
  value: "SFA.DAS.Campaigns.UITests"

resources:
  repositories:
  - repository: self
  - repository: das-platform-building-blocks
    type: github
    name: SkillsFundingAgency/das-platform-building-blocks
    ref: refs/tags/3.0.17
    endpoint: SkillsFundingAgency
  - repository: das-platform-automation
    type: github
    name: SkillsFundingAgency/das-platform-automation
    ref: refs/tags/5.1.17
    endpoint: SkillsFundingAgency

pool:
  vmImage: 'windows-latest'

stages:
- stage: BuildDeployAndTestPP
  displayName: Build, deploy and test PP
  jobs:
  - job: CodeBuild
    displayName: Code Build
    timeoutInMinutes: 30
    workspace:
      clean: all
    variables:
    - group: BUILD Management Resources
    steps:
    - checkout: das-platform-automation
      path: s/das-platform-automation
      displayName: Checkout das-platform-automation

    - checkout: self
      path: s/das-playwright-automation-test-suite
      displayName: Checkout current branch

    - task: PowerShell@2
      name: buildProjectPaths
      displayName: Build Project File Path
      inputs:
        targetType: inline
        script: >
          $projects = @('$(projectName)' -split "`r?`n" | ForEach-Object { $_.Trim().Replace('"','') } | Where-Object { $_ -ne "" })

          $first = $projects[0]

          $paths = $projects | ForEach-Object { "das-playwright-automation-test-suite/src/$_/*.csproj" }

          $joined = @($paths -join "%0D%0A")

          Write-Host $joined

          Write-Host "##vso[task.setvariable variable=projectsToBuild;]$joined"

          Write-Host "##vso[task.setvariable variable=projectName;isOutput=true]$first"

    - task: DotNetCoreCLI@2
      displayName: dotnet build
      inputs:
        arguments: '--configuration $(BuildConfiguration)'
        projects: |
          $(projectsToBuild)
  
    - task: DotNetCoreCLI@2
      displayName: 'dotnet pack'
      inputs:
        command: 'pack'
        projects: |
          $(projectsToBuild)
        packDirectory: '$(System.DefaultWorkingDirectory)/drop'
        arguments: '--configuration $(BuildConfiguration) --no-restore'

    - task: DotNetCoreCLI@2
      displayName: 'dotnet publish'
      inputs:
        command: publish
        publishWebProjects: false
        zipAfterPublish: false
        projects: |
          $(projectsToBuild)
        arguments: '--configuration $(BuildConfiguration) --output $(System.DefaultWorkingDirectory)/drop/tests --no-restore --no-build'

    - task: CopyFiles@2
      displayName: 'Copy config files'
      inputs:
        SourceFolder: 'das-playwright-automation-test-suite'
        Contents: |
          src/**/*.sql
          src/**/appsettings.Config.json
          src/**/appsettings.AdminConfig.json
          src/**/appsettings.ProviderConfig.json
          src/**/appsettings.TimeOutConfig.json
          src/**/appsettings.TestExecution.json
          src/**/appsettings.NServiceBusConfig.json
          src/**/appsettings.BrowserStack.json
          src/**/appsettings.ApiFramework.json
        TargetFolder: '$(System.DefaultWorkingDirectory)/drop/tests/files'
        flattenFolders: true
        OverWrite: true
      
    - task: CopyFiles@2
      displayName: 'Copy project json files'
      inputs:
        SourceFolder: 'das-playwright-automation-test-suite'
        Contents: |
          src/**/appsettings.Project.json
        TargetFolder: '$(System.DefaultWorkingDirectory)/drop/tests/'
        flattenFolders: false
        OverWrite: true

    - task: CopyFiles@2
      displayName: 'Copy Check-TestResults.ps1'
      inputs:
        SourceFolder: 'das-playwright-automation-test-suite'
        Contents: |
          src/**/Check-TestResults.ps1
        TargetFolder: '$(System.DefaultWorkingDirectory)/drop'
        OverWrite: true

    - task: CopyFiles@2
      displayName: 'Copy UpdateNoofTestWorkers.ps1'
      inputs:
        SourceFolder: 'das-playwright-automation-test-suite'
        Contents: |
          src/**/UpdateNoofTestWorkers.ps1
        TargetFolder: '$(System.DefaultWorkingDirectory)/drop'
        OverWrite: true

    - task: CopyFiles@2
      displayName: 'Copy runsettings'
      inputs:
        SourceFolder: 'das-playwright-automation-test-suite'
        Contents: |
          src/**/*.runsettings
        TargetFolder: '$(System.DefaultWorkingDirectory)/drop/runsettings'
        OverWrite: true

    - task: CmdLine@2
      inputs:
        script: |
          echo "Tree Structure of Drop Directory:"
          tree $(System.DefaultWorkingDirectory)/drop /f
          echo **************************************************************
          echo "Tree Structure of Artifacts Directory:"
          tree $(System.DefaultWorkingDirectory) /f
          
      displayName: 'Agent Folder Structure'
      condition: always()
      continueOnError: true
  
  - deployment: Deploy_AutomationTests
    displayName: Deploy Automation Tests to PP
    dependsOn: CodeBuild
    environment:
      name: PP_AUTOMATION
    timeoutInMinutes: 90
    variables:
    - group: "PreProd Management Resources"
    - group: "PreProd Shared Resources"
    - group: "PreProd Automation Suite Variables"
    - name: headless
      value: 'false'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: TotalALM.totalalm-tokenization.tokenization-build-task.Tokenization@2
            displayName: 'Tokenization: Transform file *.json'
            inputs:
              SourcePath: '$(System.DefaultWorkingDirectory)/drop/tests'
              TargetFileNames: '*.json'

          - task: TotalALM.totalalm-tokenization.tokenization-build-task.Tokenization@2
            displayName: 'Tokenization: Transform file *.runsettings'
            inputs:
              SourcePath: '$(System.DefaultWorkingDirectory)/drop/runsettings/src/'
              TargetFileNames: '*.runsettings'

          - task: BrowserStackConfig@0
            inputs:
              browserstackServiceEndPoint: 'AS-Browserstack'

          - task: PowerShell@2
            displayName: 'Install Playwright Browsers'
            inputs:
              targetType: 'filePath'
              filePath: '$(System.DefaultWorkingDirectory)/drop/tests/$(projectName)/playwright.ps1'
              arguments: install $(BROWSER_TYPE)

          - task: ms-autotest.screen-resolution-utility-task.screen-resolution-utlity-task.ScreenResolutionUtility@1
            displayName: 'Set Screen Resolution'
            inputs:
              displaySettings: specific
              width: 1920
              height: 1080

          - task: AzurePowerShell@5
            displayName: "Get Agent's IP Address"
            inputs:
              azureSubscription: das-pp-automation-test-suite-db-sc
              ScriptPath: '$(System.DefaultWorkingDirectory)/das-platform-automation/Infrastructure-Scripts/Get-MyIpAddress.ps1'
              ScriptArguments: '-WhatsMyIpUrl "https://ifconfig.me/ip"'
              azurePowerShellVersion: LatestVersion

          - task: AzurePowerShell@5
            displayName: "Whitelist agent's IP address"
            inputs:
              azureSubscription: das-pp-automation-test-suite-db-sc
              ScriptPath: '$(System.DefaultWorkingDirectory)/das-platform-automation/Infrastructure-Scripts/Add-AzSqlIpException.ps1'
              ScriptArguments: '-Name $(Build.DefinitionName) -IPAddress $(IPAddress) -ResourceNamePattern $(SharedSQLServerName)'
              azurePowerShellVersion: LatestVersion

          - task: AzurePowerShell@5
            displayName: "Whitelist agent's IP address on $(AppServiceName)"
            condition: ne('', '')
            inputs:
              azureSubscription: das-pp-automation-test-suite-db-sc
              ScriptPath: '$(System.DefaultWorkingDirectory)/das-platform-automation/Infrastructure-Scripts/Add-AppServiceIpException.ps1'
              ScriptArguments: '-ResourceName  -IPAddress $(IPAddress) -RuleName '
              azurePowerShellVersion: LatestVersion

          - task: AzurePowerShell@5
            displayName: "Whitelist agent's IP address on Function App"
            inputs:
              azureSubscription: das-pp-automation-test-suite-db-sc
              ScriptPath: '$(System.DefaultWorkingDirectory)/das-platform-automation/Infrastructure-Scripts/Add-AppServiceIpException.ps1'
              ScriptArguments: -IpAddress $(IPAddress) -ResourceNames "das-pp-sbus-tools-fa" -RuleName ""
              azurePowerShellVersion: LatestVersion
            condition: and(succeeded(), eq('False', 'true'))

          - task: AzureCLI@2
            displayName: 'Bootstrap Azure SP credentials'
            inputs:
              azureSubscription: das-pp-automation-test-suite-db-sc
              addSpnToEnvironment: true
              scriptType: ps
              scriptLocation: inlineScript
              inlineScript: |
                # Promote SP credentials from the service connection to pipeline variables
                Write-Host "##vso[task.setvariable variable=AZURE_CLIENT_ID;issecret=false]$env:servicePrincipalId"
                Write-Host "##vso[task.setvariable variable=AZURE_TENANT_ID;issecret=false]$env:tenantId"
                Write-Host "##vso[task.setvariable variable=AZURE_CLIENT_SECRET;issecret=true]$env:servicePrincipalKey"

          # - task: CmdLine@2
          #   displayName: 'BrowserStack SDK - PP test execution'
          #   env:
          #     AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
          #     AZURE_TENANT_ID: $(AZURE_TENANT_ID)
          #     AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
          #     BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
          #     BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
          #   inputs:
          #     script: |
          #       dotnet browserstack-sdk ^
          #         --configuration "$(BuildConfiguration)" ^
          #         --no-build ^
          #         --no-restore ^
          #         --logger "trx;LogFileName=TestResults.trx" ^
          #         --results-directory "$(Agent.TempDirectory)/TestResults" ^
          #         --settings "$(System.DefaultWorkingDirectory)/drop/runsettings/src/Parellel.runsettings" ^
          #         --filter "$(TestCategory)&TestCategory!=ignoreinpp"
          #     workingDirectory: '$(System.DefaultWorkingDirectory)/drop/tests/'
          #   continueOnError: true

          - task: VSTest@3
            displayName: 'VsTest - Test Execution'
            env:
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
              BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)
            inputs:
              testAssemblyVer2: '**\**\SFA.DAS*tests*.dll'
              testRunTitle: Test Run - PP
              searchFolder: '$(System.DefaultWorkingDirectory)/drop/tests/'
              testFiltercriteria: '"$(TestCategory)&TestCategory!=ignoreinpp&TestCategory!=accessibility"'
              runSettingsFile: '$(System.DefaultWorkingDirectory)/drop/runsettings/src/Parellel.runsettings'
              runInParallel: true
              otherConsoleOptions: '/logger:trx'
              rerunFailedTests: true
              rerunType: basedontestfailurepercentage
              rerunFailedTestsMaxPercent: 30
              rerunMaxAttempts: 1
            continueOnError: true

          - task: AzurePowerShell@5
            displayName: "SQL - Remove Whitelisted Agent's IP Address"
            inputs:
              azureSubscription: das-pp-automation-test-suite-db-sc
              ScriptPath: '$(System.DefaultWorkingDirectory)/das-platform-automation/Infrastructure-Scripts/Remove-AzSqlIpException.ps1'
              ScriptArguments: '-Name $(Build.DefinitionName) -IPAddress $(IPAddress) -ResourceNamePattern $(SharedSQLServerName)'
              azurePowerShellVersion: LatestVersion
            condition: succeededOrFailed()

          - task: AzurePowerShell@5
            displayName: "App Service - Remove Whitelisted Agent's IP Address"
            inputs:
              azureSubscription: das-pp-automation-test-suite-db-sc
              ScriptPath: '$(System.DefaultWorkingDirectory)/das-platform-automation/Infrastructure-Scripts/Remove-AppServiceIpException.ps1'
              ScriptArguments: '-IPAddress $(IPAddress) -ResourceName '
              azurePowerShellVersion: LatestVersion
              pwsh: true
            condition: and(succeededOrFailed(), ne('', ''))

          - task: AzurePowerShell@5
            displayName: "Function App- Remove Whitelisted Agent's IP Address"
            inputs:
              azureSubscription: das-pp-automation-test-suite-db-sc
              ScriptPath: '$(System.DefaultWorkingDirectory)/das-platform-automation/Infrastructure-Scripts/Remove-AppServiceIpException.ps1'
              ScriptArguments: '-IPAddress $(IPAddress) -ResourceNames "das-pp-sbus-tools-fa"'
              azurePowerShellVersion: LatestVersion
              pwsh: true
            condition: and(succeededOrFailed(), eq('False', 'true'))

          - task: PowerShell@2
            displayName: 'Check .trx File Exists'
            inputs:
              targetType: 'filePath'
              filePath: '$(System.DefaultWorkingDirectory)/drop/src/Check-TestResults.ps1'
              arguments: '-SourcePath "$(Agent.TempDirectory)/TestResults"'
            condition: succeededOrFailed()

          - task: BrowserStackResults@0
            inputs:
              browserstackProduct: 'observability'