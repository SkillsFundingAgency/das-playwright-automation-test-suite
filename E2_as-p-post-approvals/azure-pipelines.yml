trigger: none
pr: none
schedules:
- cron: '0 3 * * 1-5'
  displayName: ScheduledRun
  branches:
    include:
    - master
  always: true

variables:
  - template: ../pipeline-templates/vars.yml
  - name: projectName
    value: "SFA.DAS.Approvals.UITests"
  - name: RuleName
    value: "E2_as-post-approvals-test-suite"
  - name: RuleName2
    value: "E2_as-post-approvals-test-suite2"
  - name: ResourceName
    value: "$(EmployerAccountsAppWhitelistName)"
  - name: ResourceName2
    value: "$(CommitmentsAppWhitelistName)"

resources:
  repositories:
    - repository: self
    - repository: das-platform-building-blocks
      type: github
      name: SkillsFundingAgency/das-platform-building-blocks
      ref: refs/tags/3.0.17
      endpoint: SkillsFundingAgency
    - repository: das-platform-automation
      type: github
      name: SkillsFundingAgency/das-platform-automation
      ref: refs/tags/5.1.17
      endpoint: SkillsFundingAgency

pool:
  vmImage: 'windows-latest'

stages:
  - template: ../pipeline-templates/stage/environment-stage.yml
    parameters:
      projectName: $(projectName)
      BuildConfiguration: $(BuildConfiguration)
      deploy: $(Deploy)
      RuleName: $(RuleName)
      RuleName2: $(RuleName2)
      ResourceName: $(ResourceName)
      ResourceName2: $(ResourceName2)
      WhiteListFunction: true
