## Notes
notes: |
  - This agent is designed for C# .NET 10 environments with Playwright and Reqnroll
  - Qwen provides deep code analysis and pattern recognition
  - GPT Mini provides efficient code generation and documentation
  - Compatible with Microsoft Foundry for deployment and optimization
  - Can be deployed locally or as a hosted agent in Azure
  - Supports continuous evaluation and prompt optimization through Foundry
